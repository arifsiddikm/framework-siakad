<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustrasi gedung kampus">
  <rect width="800" height="900" fill="#CCDBF4"/>
